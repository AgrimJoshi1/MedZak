<header class="main-header site-header" data-header>
  <div class="utility-bar">
    <div class="container utility-inner">
      <ul class="utility-info">
        <li><a href="contact.html#map"><svg class="icon"><use href="#i-map-pin"/></svg>Plot-39C, Sector 6 Dwarka, New Delhi</a></li>
        <li><a href="mailto:admin@medzak.co"><svg class="icon"><use href="#i-mail"/></svg>admin@medzak.co</a></li>
      </ul>
      <ul class="utility-links">
        <li><a href="#callback" data-modal="callback"><svg class="icon"><use href="#i-phone"/></svg>Request a Call Back</a></li>
        <li><a href="careers.html"><svg class="icon"><use href="#i-briefcase"/></svg>Careers</a></li>
        <li><button type="button" class="utility-search" data-modal="palette"><svg class="icon"><use href="#i-search"/></svg>Search <kbd>Ctrl&nbsp;K</kbd></button></li>
      </ul>
    </div>
  </div>
  <div class="container header-bar">
    <a class="logo" href="index.html" aria-label="Medzak Healthcare — home"><img src="assets/images/logo.png" srcset="assets/images/thumbs/logo-320.png 320w, assets/images/logo.png 800w" sizes="156px" alt="Medzak Healthcare Pvt. Ltd." width="800" height="197"></a>
    <nav class="main-menu" id="site-menu" aria-label="Main">
      {{nav}}
    </nav>
    <div class="header-actions">
      <button class="search-btn icon-btn" type="button" data-modal="palette" aria-label="Search the site" title="Search (Ctrl+K)"><svg class="icon"><use href="#i-search"/></svg></button>
      <button class="theme-toggle icon-btn" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle light / dark theme"><svg class="icon i-moon"><use href="#i-moon"/></svg><svg class="icon i-sun"><use href="#i-sun"/></svg></button>
      <a href="#bookDemo" class="btn btn--primary btn--sm header-cta" data-modal="bookDemo">BOOK A DEMO</a>
      <button class="nav-toggle icon-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><svg class="icon i-menu"><use href="#i-menu"/></svg><svg class="icon i-close"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="header-progress" aria-hidden="true"><span></span></div>
</header>
